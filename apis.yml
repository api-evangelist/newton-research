aid: newton-research
name: Newton Research
description: >-
  Newton Research builds a team of specially trained AI agents for marketing
  analytics. Pre-built or custom agents connect to a customer's existing data
  infrastructure, write and execute code, and automate analytics workflows —
  data exploration and preparation, audience management, Customer 360, planning
  and activation, cross-channel measurement and attribution, anomaly detection,
  yield management, and automated reporting — with data remaining on the
  customer's own instance. Founded by John Hoctor, Matthew Emans, and Steven
  Bennett, the company is backed by Bessemer Venture Partners and is a member of
  the NVIDIA Inception program. Newton states SOC 2, GDPR, and CCPA compliance.
  No public developer API surface is published as of this profile.
